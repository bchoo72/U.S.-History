<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
  user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="History Timeline">

<title>History Timeline</title>

<style>

:root {
  --bg: #f6f8fc;
  --card: #ffffff;
  --navy: #10204d;
  --blue: #1769e0;
  --blue-light: #eaf2ff;
  --text: #111b33;
  --gray: #69738a;
  --border: #dfe5ef;
  --red: #d83a44;
  --green: #16845b;
  --shadow: 0 5px 18px rgba(15, 31, 73, 0.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Arial,
    sans-serif;
}

body {
  overscroll-behavior-y: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(246, 248, 252, .95);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  padding:
    calc(env(safe-area-inset-top) + 14px)
    16px
    10px;
  border-bottom: 1px solid rgba(0,0,0,.05);
}

.headerRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.appTitle {
  font-size: 28px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: -.6px;
}

.iconButton {
  border: 0;
  background: var(--blue-light);
  color: var(--blue);
  width: 42px;
  height: 42px;
  border-radius: 14px;
  font-size: 23px;
  font-weight: 700;
}

/* SEARCH */

.searchWrap {
  margin-top: 12px;
}

.searchInput {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  outline: none;
  font-size: 16px;
}

.searchInput:focus {
  border-color: var(--blue);
}

/* FILTER TABS */

.tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-top: 10px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  border: 0;
  background: transparent;
  color: var(--gray);
  padding: 9px 13px;
  border-radius: 12px;
  white-space: nowrap;
  font-weight: 700;
}

.tab.active {
  background: white;
  color: var(--blue);
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

/* MAIN */

main {
  max-width: 760px;
  margin: auto;
  padding: 12px 15px 110px;
}

/* EMPTY */

.empty {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 35px 20px;
  margin-top: 24px;
  text-align: center;
  color: var(--gray);
}

.emptyTitle {
  color: var(--navy);
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 7px;
}

/* TIMELINE */

.timeline {
  position: relative;
  padding-top: 10px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 21px;
  top: 12px;
  bottom: 18px;
  width: 3px;
  border-radius: 10px;
  background: #cbd9ee;
}

.timelineItem {
  position: relative;
  padding-left: 52px;
  margin-bottom: 16px;
}

.timelineDot {
  position: absolute;
  left: 13px;
  top: 22px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  border: 4px solid var(--bg);
  box-shadow: 0 0 0 2px #b8c9e4;
  background: var(--blue);
}

.itemCard {
  border: 1px solid var(--border);
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.itemCardButton {
  width: 100%;
  background: transparent;
  border: 0;
  text-align: left;
  padding: 16px;
}

.cardTop {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.typeBadge {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--blue);
  background: var(--blue-light);
  padding: 6px 8px;
  border-radius: 20px;
  margin-bottom: 8px;
}

.cardTitle {
  color: var(--navy);
  font-size: 19px;
  font-weight: 780;
  line-height: 1.25;
}

.cardDate {
  color: var(--blue);
  margin-top: 5px;
  font-size: 14px;
  font-weight: 700;
}

.previewText {
  color: var(--gray);
  font-size: 14px;
  line-height: 1.5;
  margin-top: 10px;
}

.photoIndicator {
  flex-shrink: 0;
  padding: 6px 8px;
  background: #f1f4f8;
  border-radius: 10px;
  color: var(--gray);
  font-size: 13px;
  font-weight: 700;
}

/* LIST */

.sectionHeading {
  color: var(--navy);
  font-size: 22px;
  font-weight: 800;
  margin: 16px 2px 12px;
}

.listCard {
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  margin-bottom: 10px;
  overflow: hidden;
}

.listCard button {
  border: 0;
  background: transparent;
  width: 100%;
  padding: 15px;
  text-align: left;
}

.listTitle {
  color: var(--navy);
  font-size: 18px;
  font-weight: 760;
}

.listMeta {
  margin-top: 5px;
  font-size: 13px;
  color: var(--gray);
}

/* ADD */

.addButton {
  position: fixed;
  z-index: 80;
  right: 22px;
  bottom: calc(env(safe-area-inset-bottom) + 22px);
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 0;
  background: var(--blue);
  color: white;
  font-size: 34px;
  box-shadow: 0 8px 24px rgba(23,105,224,.35);
}

/* MODAL */

.modalOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: flex-end;
  background: rgba(5,13,32,.45);
}

.modalOverlay.visible {
  display: flex;
}

.modal {
  background: white;
  width: 100%;
  max-height: 94vh;
  overflow-y: auto;
  border-radius: 24px 24px 0 0;
  padding-bottom: calc(env(safe-area-inset-bottom) + 18px);
}

.modalHandle {
  width: 42px;
  height: 5px;
  background: #d3d7df;
  border-radius: 10px;
  margin: 9px auto 2px;
}

.modalHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 17px;
  border-bottom: 1px solid var(--border);
}

.modalTitle {
  color: var(--navy);
  font-size: 21px;
  font-weight: 800;
}

.closeButton {
  width: 35px;
  height: 35px;
  border: 0;
  border-radius: 50%;
  background: #eff1f5;
  color: #50596d;
  font-size: 20px;
}

.modalContent {
  padding: 18px;
}

/* FORM */

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;
  color: var(--navy);
  font-size: 13px;
  font-weight: 750;
  margin: 0 0 7px 2px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: white;
  padding: 12px;
  outline: none;
  font-size: 16px;
}

.field textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.5;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--blue);
}

.formRow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.smallHelp {
  color: var(--gray);
  font-size: 12px;
  line-height: 1.4;
  margin-top: 6px;
}

.primaryButton,
.secondaryButton {
  width: 100%;
  border-radius: 14px;
  padding: 14px;
  font-weight: 750;
  font-size: 16px;
}

.primaryButton {
  border: 0;
  background: var(--blue);
  color: white;
}

.secondaryButton {
  border: 1px solid var(--border);
  background: white;
  color: var(--navy);
}

.dangerButton {
  border-color: #ffd3d5;
  color: var(--red);
}

/* DETAILS */

.detailTop {
  position: relative;
}

.detailType {
  font-size: 12px;
  text-transform: uppercase;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: .6px;
}

.detailTitle {
  color: var(--navy);
  font-size: 28px;
  font-weight: 820;
  letter-spacing: -.5px;
  line-height: 1.12;
  margin-top: 6px;
  padding-right: 65px;
}

.detailDate {
  color: var(--blue);
  font-weight: 700;
  margin-top: 8px;
}

.editMiniButton {
  position: absolute;
  right: 0;
  top: 0;
  border: 0;
  border-radius: 12px;
  background: var(--blue-light);
  color: var(--blue);
  padding: 8px 10px;
  font-weight: 700;
}

.descriptionHeading {
  color: var(--navy);
  font-size: 16px;
  font-weight: 800;
  margin: 22px 0 8px;
}

.detailDescription {
  font-size: 16px;
  line-height: 1.6;
  white-space: pre-wrap;
}

/* GALLERY */

.gallery {
  margin: 20px -18px 0;
  background: #101318;
  overflow: hidden;
  position: relative;
}

.galleryTrack {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.galleryTrack::-webkit-scrollbar {
  display: none;
}

.gallerySlide {
  flex: 0 0 100%;
  height: 330px;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gallerySlide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.galleryCount {
  position: absolute;
  right: 10px;
  bottom: 10px;
  color: white;
  background: rgba(0,0,0,.58);
  padding: 5px 9px;
  border-radius: 15px;
  font-size: 12px;
}

/* PHOTOS */

.photoPreviewGrid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin-top: 11px;
}

.photoPreview {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 11px;
  background: #e8ecf2;
}

.photoPreview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.removePhoto {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 25px;
  height: 25px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.7);
  color: white;
}

/* CATEGORY MANAGER */

.categoryRow {
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
}

.categoryName {
  flex: 1;
  font-weight: 700;
  color: var(--navy);
}

.smallAction {
  border: 0;
  border-radius: 10px;
  padding: 7px 9px;
  background: var(--blue-light);
  color: var(--blue);
  font-weight: 700;
}

.smallDanger {
  background: #fff0f1;
  color: var(--red);
}

/* SETTINGS */

.settingsSection {
  border-top: 1px solid var(--border);
  margin-top: 18px;
  padding-top: 18px;
}

.settingsHeading {
  color: var(--navy);
  font-weight: 800;
  margin-bottom: 10px;
}

.fileButton {
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px;
  text-align: center;
  color: var(--navy);
  font-weight: 700;
  margin-top: 10px;
}

#importFile {
  display: none;
}

@media (min-width:700px) {

  .modalOverlay {
    align-items: center;
    justify-content: center;
    padding: 30px;
  }

  .modal {
    max-width: 650px;
    border-radius: 24px;
    max-height: 90vh;
  }

  .modalHandle {
    display: none;
  }

}

</style>
</head>

<body>

<header>

  <div class="headerRow">

    <div class="appTitle">
      History
    </div>

    <button
      class="iconButton"
      id="settingsButton"
      aria-label="Settings"
    >
      ⋯
    </button>

  </div>

  <div class="searchWrap">

    <input
      id="searchInput"
      class="searchInput"
      type="search"
      placeholder="Search history..."
      autocomplete="off"
    >

  </div>

  <div class="tabs" id="tabsContainer"></div>

</header>


<main id="mainContent"></main>


<button
  class="addButton"
  id="addButton"
>
  +
</button>


<!-- DETAIL -->

<div class="modalOverlay" id="detailOverlay">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalHeader">

      <div class="modalTitle">
        History
      </div>

      <button
        class="closeButton"
        data-close="detailOverlay"
      >
        ×
      </button>

    </div>

    <div class="modalContent" id="detailContent"></div>

  </div>

</div>


<!-- ENTRY EDITOR -->

<div class="modalOverlay" id="editorOverlay">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalHeader">

      <div class="modalTitle" id="editorTitle">
        Add Entry
      </div>

      <button
        class="closeButton"
        data-close="editorOverlay"
      >
        ×
      </button>

    </div>

    <div class="modalContent">

      <form id="entryForm">

        <input type="hidden" id="entryId">

        <div class="field">

          <label>
            Category
          </label>

          <select
            id="entryCategory"
            required
          ></select>

        </div>


        <div class="field">

          <label>
            Name / Title
          </label>

          <input
            id="entryName"
            type="text"
            placeholder="e.g. Battle of Hastings"
            required
          >

        </div>


        <div class="field">

          <label>
            Display Date
          </label>

          <input
            id="dateLabel"
            type="text"
            placeholder="e.g. October 14, 1066"
          >

          <div class="smallHelp">
            This is exactly how the date will appear.
          </div>

        </div>


        <div class="formRow">

          <div class="field">

            <label>
              Timeline Year
            </label>

            <input
              id="sortYear"
              type="number"
              placeholder="1066"
              required
            >

          </div>

          <div class="field">

            <label>
              Era
            </label>

            <select id="era">

              <option value="CE">
                CE
              </option>

              <option value="BCE">
                BCE
              </option>

            </select>

          </div>

        </div>


        <div class="field">

          <label>
            Significance / Description
          </label>

          <textarea
            id="description"
            placeholder="Explain why this person, event, place, object, document, date, etc. is historically important..."
          ></textarea>

        </div>


        <div class="field">

          <label>
            Photo Library
          </label>

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
          >

          <div class="smallHelp">
            Add several images. Swipe through them when viewing the entry.
          </div>

          <div
            id="photoPreviewGrid"
            class="photoPreviewGrid"
          ></div>

        </div>


        <button
          class="primaryButton"
          type="submit"
        >
          Save Entry
        </button>

        <button
          class="secondaryButton dangerButton"
          id="deleteEntryButton"
          type="button"
          style="display:none;margin-top:10px;"
        >
          Delete Entry
        </button>

      </form>

    </div>

  </div>

</div>


<!-- SETTINGS -->

<div class="modalOverlay" id="settingsOverlay">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalHeader">

      <div class="modalTitle">
        Settings
      </div>

      <button
        class="closeButton"
        data-close="settingsOverlay"
      >
        ×
      </button>

    </div>

    <div class="modalContent">

      <button
        class="primaryButton"
        id="manageCategoriesButton"
      >
        Manage Categories
      </button>


      <div class="settingsSection">

        <div class="settingsHeading">
          Database Backup
        </div>

        <button
          class="secondaryButton"
          id="exportButton"
        >
          Export Backup
        </button>

        <label class="fileButton">

          Import Backup

          <input
            type="file"
            id="importFile"
            accept=".json,application/json"
          >

        </label>

      </div>


      <div class="settingsSection">

        <button
          class="secondaryButton dangerButton"
          id="eraseButton"
        >
          Erase Entire Database
        </button>

      </div>

    </div>

  </div>

</div>


<!-- CATEGORY MANAGER -->

<div class="modalOverlay" id="categoryOverlay">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalHeader">

      <div class="modalTitle">
        Categories
      </div>

      <button
        class="closeButton"
        data-close="categoryOverlay"
      >
        ×
      </button>

    </div>

    <div class="modalContent">

      <div class="field">

        <label>
          New Category
        </label>

        <input
          id="newCategoryInput"
          type="text"
          placeholder="e.g. Places"
        >

      </div>

      <button
        class="primaryButton"
        id="addCategoryButton"
      >
        Add Category
      </button>


      <div class="settingsSection">

        <div class="settingsHeading">
          Your Categories
        </div>

        <div id="categoryList"></div>

      </div>

    </div>

  </div>

</div>


<script>

/* ==========================================================
   DATABASE
========================================================== */

const DB_NAME = "HistoryTimelineDB";
const DB_VERSION = 2;

const ENTRY_STORE = "entries";
const CATEGORY_STORE = "categories";

let db;

let entries = [];
let categories = [];

let currentView = "timeline";

let editingPhotos = [];


/* ==========================================================
   OPEN DATABASE
========================================================== */

function openDatabase() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = event => {

      const database =
        event.target.result;

      if (
        !database.objectStoreNames.contains(
          ENTRY_STORE
        )
      ) {

        database.createObjectStore(
          ENTRY_STORE,
          {
            keyPath: "id",
            autoIncrement: true
          }
        );

      }

      if (
        !database.objectStoreNames.contains(
          CATEGORY_STORE
        )
      ) {

        database.createObjectStore(
          CATEGORY_STORE,
          {
            keyPath: "id",
            autoIncrement: true
          }
        );

      }

    };

    request.onsuccess = event => {

      db =
        event.target.result;

      resolve();

    };

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   LOAD ENTRIES
========================================================== */

function loadEntries() {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        ENTRY_STORE,
        "readonly"
      );

    const store =
      transaction.objectStore(
        ENTRY_STORE
      );

    const request =
      store.getAll();

    request.onsuccess = () => {

      entries =
        request.result || [];

      resolve();

    };

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   LOAD CATEGORIES
========================================================== */

function loadCategories() {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        CATEGORY_STORE,
        "readonly"
      );

    const store =
      transaction.objectStore(
        CATEGORY_STORE
      );

    const request =
      store.getAll();

    request.onsuccess = () => {

      categories =
        request.result || [];

      resolve();

    };

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   SAVE ENTRY
========================================================== */

function saveEntry(entry) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        ENTRY_STORE,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        ENTRY_STORE
      );

    let request;

    if (entry.id) {

      request =
        store.put(entry);

    } else {

      delete entry.id;

      request =
        store.add(entry);

    }

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   SAVE CATEGORY
========================================================== */

function saveCategory(category) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        CATEGORY_STORE,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        CATEGORY_STORE
      );

    let request;

    if (category.id) {

      request =
        store.put(category);

    } else {

      delete category.id;

      request =
        store.add(category);

    }

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   DELETE ENTRY
========================================================== */

function deleteEntry(id) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        ENTRY_STORE,
        "readwrite"
      );

    const request =
      transaction
        .objectStore(ENTRY_STORE)
        .delete(id);

    request.onsuccess = resolve;

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   DELETE CATEGORY
========================================================== */

function deleteCategory(id) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        CATEGORY_STORE,
        "readwrite"
      );

    const request =
      transaction
        .objectStore(CATEGORY_STORE)
        .delete(id);

    request.onsuccess = resolve;

    request.onerror = () =>
      reject(request.error);

  });

}


/* ==========================================================
   DEFAULT CATEGORIES
========================================================== */

async function createDefaultCategories() {

  if (categories.length) {
    return;
  }

  const defaults = [
    "Events",
    "People",
    "Places",
    "Dates",
    "Objects"
  ];

  for (const name of defaults) {

    await saveCategory({
      name
    });

  }

  await loadCategories();

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================================================
   TIMELINE SORT
========================================================== */

function chronologicalValue(entry) {

  const year =
    Number(entry.sortYear) || 0;

  if (entry.era === "BCE") {

    return -year;

  }

  return year;

}


/* ==========================================================
   CATEGORY NAME
========================================================== */

function getCategoryName(categoryId) {

  const category =
    categories.find(
      category =>
        category.id === categoryId
    );

  return category
    ? category.name
    : "Uncategorized";

}


/* ==========================================================
   SEARCH
========================================================== */

function getFilteredEntries() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  let list =
    [...entries];

  if (
    currentView !== "timeline" &&
    currentView !== "all"
  ) {

    list =
      list.filter(
        entry =>
          String(entry.categoryId) ===
          String(currentView)
      );

  }

  if (search) {

    list =
      list.filter(entry => {

        const category =
          getCategoryName(
            entry.categoryId
          );

        return (
          entry.name
            .toLowerCase()
            .includes(search) ||

          (entry.description || "")
            .toLowerCase()
            .includes(search) ||

          (entry.dateLabel || "")
            .toLowerCase()
            .includes(search) ||

          category
            .toLowerCase()
            .includes(search)
        );

      });

  }

  return list;

}

   TABS
========================================================== */

}


/* ==========================================================
   RENDER
========================================================== */

function render() {

  const container =
    document.getElementById(
      "mainContent"
    );

  const list =
    getFilteredEntries();

  if (currentView === "timeline") {

    renderTimeline(
      container,
      list
    );

  } else {

    renderList(
      container,
      list
    );

  }

}


/* ==========================================================
   TIMELINE
========================================================== */

function renderTimeline(container, list) {

  list.sort(
    (a,b) =>
      chronologicalValue(a) -
      chronologicalValue(b)
  );

  if (!list.length) {

    container.innerHTML = `

      <div class="empty">

        <div class="emptyTitle">
          Your timeline is empty
        </div>

        Tap + to add your first historical entry.

      </div>

    `;

    return;

  }

  let html =
    `<div class="timeline">`;

  list.forEach(entry => {

    const category =
      getCategoryName(
        entry.categoryId
      );

    const photoCount =
      entry.photos?.length || 0;

    html += `

      <div class="timelineItem">

        <div class="timelineDot"></div>

        <div class="itemCard">

          <button
            class="itemCardButton"
            onclick="showDetails(${entry.id})"
          >

            <div class="cardTop">

              <div>

                <div class="typeBadge">
                  ${escapeHTML(category)}
                </div>

                <div class="cardTitle">
                  ${escapeHTML(entry.name)}
                </div>

                <div class="cardDate">
                  ${escapeHTML(
                    entry.dateLabel || ""
                  )}
                </div>

              </div>

              ${
                photoCount
                ? `
                    <div class="photoIndicator">
                      📷 ${photoCount}
                    </div>
                  `
                : ""
              }

            </div>

            ${
              entry.description
              ? `
                <div class="previewText">

                  ${escapeHTML(
                    entry.description.length > 150
                    ? entry.description.substring(0,150) + "…"
                    : entry.description
                  )}

                </div>
              `
              : ""
            }

          </button>

        </div>

      </div>

    `;

  });

  html += `</div>`;

  container.innerHTML =
    html;

}

/* ==========================================================
   RESIZE PHOTO
========================================================== */

function resizeImage(file) {

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const image =
            new Image();

          image.onload = () => {

            const MAX = 1800;

            let width =
              image.width;

            let height =
              image.height;

            if (
              width > height &&
              width > MAX
            ) {

              height *=
                MAX / width;

              width =
                MAX;

            }

            else if (
              height > MAX
            ) {

              width *=
                MAX / height;

              height =
                MAX;

            }

            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              Math.round(width);

            canvas.height =
              Math.round(height);

            const context =
              canvas.getContext(
                "2d"
              );

            context.drawImage(
              image,
              0,
              0,
              canvas.width,
              canvas.height
            );

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                .84
              )
            );

          };

          image.onerror =
            reject;

          image.src =
            event.target.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

/* ==========================================================
   REMOVE CATEGORY
========================================================== */

async function removeCategory(id) {

  const category =
    categories.find(
      category =>
        category.id === id
    );

  if (!category) {
    return;
  }

  const used =
    entries.filter(
      entry =>
        entry.categoryId === id
    );

  if (used.length) {

    alert(
      `"${category.name}" contains ${used.length} historical entries.

Move or delete those entries before deleting the category.`
    );

    return;

  }

  const confirmed =
    confirm(
      `Delete category "${category.name}"?`
    );

  if (!confirmed) {
    return;
  }

  await deleteCategory(id);

  await loadCategories();

  currentView =
    "timeline";

  renderCategoryList();

  renderTabs();

  render();

}

  "click",
  () => {

      version: 2,

      created:
        new Date().toISOString(),

      categories,

      entries

    };

      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      "history-timeline-backup.json";

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
      url
    );

  }
);


/* ==========================================================
   IMPORT DATABASE
========================================================== */

document.getElementById(
  "importFile"
).addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    try {

      const text =
        await file.text();

      const data =
        JSON.parse(text);

      if (
        !Array.isArray(data.entries)
      ) {

        throw new Error(
          "Invalid backup."
        );

      }

      const confirmed =
        confirm(
          "Import this backup?"
        );

      if (!confirmed) {
        return;
      }

      const categoryMap = {};

      if (
        Array.isArray(
          data.categories
        )
      ) {

        for (
          const importedCategory
          of data.categories
        ) {

          const existing =
            categories.find(
              category =>
                category.name
                  .toLowerCase() ===
                importedCategory.name
                  .toLowerCase()
            );

          if (existing) {

            categoryMap[
              importedCategory.id
            ] =
              existing.id;

          } else {

            const newId =
              await saveCategory({
                name:
                  importedCategory.name
              });

            categoryMap[
              importedCategory.id
            ] =
              newId;

          }

        }

      }

      await loadCategories();

      for (
        const importedEntry
        of data.entries
      ) {

        const copy =
          {...importedEntry};

        delete copy.id;

        if (
          categoryMap[
            copy.categoryId
          ]
        ) {

          copy.categoryId =
            categoryMap[
              copy.categoryId
            ];

        }

        await saveEntry(
          copy
        );

      }

      await loadEntries();

      renderTabs();

      render();

      closeModal(
        "settingsOverlay"
      );

      alert(
        "Import complete."
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "That file could not be imported."
      );

    }

    event.target.value = "";

  }
);


/* ==========================================================
   ERASE DATABASE
========================================================== */

document.getElementById(
  "eraseButton"
).addEventListener(
  "click",
  async () => {

    const confirmed =
      confirm(
        "Erase all historical entries and categories?"
      );

    if (!confirmed) {
      return;
    }

    const second =
      confirm(
        "This cannot be undone unless you have a backup. Continue?"
      );

    if (!second) {
      return;
    }

    const transaction =
      db.transaction(
        [
          ENTRY_STORE,
          CATEGORY_STORE
        ],
        "readwrite"
      );

    transaction
      .objectStore(
        ENTRY_STORE
      )
      .clear();

    transaction
      .objectStore(
        CATEGORY_STORE
      )
      .clear();

    transaction.oncomplete =
      async () => {

        entries = [];
        categories = [];

        await createDefaultCategories();

        currentView =
          "timeline";

        renderTabs();

        render();

        closeModal(
          "settingsOverlay"
        );

      };

  }
);
